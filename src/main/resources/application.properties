# =====================================================================
# Cau hinh ung dung QLDAPM-ShippingOrder (UC-01)
# KHONG ghi mat khau hay token vao file nay.
# Moi gia tri deu co the ghi de bang bien moi truong cung ten.
# =====================================================================

# --- CSDL ---
# Ghi de bang bien moi truong DB_URL / DB_USER / DB_PASSWORD.
# Mac dinh la MySQL local cua nhom; mat khau rong chi dung cho may dev.
db.url=jdbc:mysql://localhost:3306/vanchuyen?useUnicode=true&characterEncoding=UTF-8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh
db.user=root
db.password=
db.driver=com.mysql.cj.jdbc.Driver

# Kich thuoc pool ket noi (HikariCP)
db.pool.maxSize=10
db.pool.minIdle=2
db.pool.connectionTimeout=10000

# --- Thue phi ---
# Thue suat VAT (%). Doi bang billing.vat-percent khi can.
billing.vat-percent=10

# --- Gioi han mot don hang (BR-14) ---
order.max-quantity-per-line=1000
order.max-lines=50
order.max-total-weight-kg=5000

# --- Dev login (TAM THOI, se bo khi co module dang nhap that) ---
# Chi bat bang bien moi truong APP_DEV_LOGIN=true. Mac dinh TAT.
app.dev-login-enabled=false

# --- Thoi gian cho toi da (ms) ---
# Client dung gia tri nay cho AbortController (ngoai le 11.1 yeu cau 10 giay).
app.request.timeout-ms=10000
